security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # Public routes
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }

        # Protected API routes
        - { path: ^/api/dashboard, roles: ROLE_COORDINATOR }
        - { path: ^/api/assignments, roles: [ROLE_STUDENT, ROLE_SUPERVISOR, ROLE_COORDINATOR] }
        - { path: ^/api/logs, roles: [ROLE_STUDENT, ROLE_SUPERVISOR, ROLE_COORDINATOR] }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }

        # Page routes are public (JWT checked in controller)
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
